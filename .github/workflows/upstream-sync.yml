name: Propose upstream sync

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact official desktop release tag (vX.Y.Z or desktop-vX.Y.Z); latest when empty"
        required: false
        type: string
  schedule:
    - cron: "23 13 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nytemode-upstream-sync
  cancel-in-progress: true

jobs:
  propose:
    if: github.repository == 'NYTEMODEONLY/buzz'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.NYTEMODE_SYNC_TOKEN }}

      - name: Resolve latest official desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-}"
          if [[ -z "$TAG" ]]; then
            TAG=$(gh api repos/block/buzz/releases/latest --jq .tag_name)
          fi
          [[ "$TAG" =~ ^(desktop-)?v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || {
            echo "::error::Latest Block release tag '$TAG' is not stable desktop SemVer"
            exit 1
          }
          VERSION="${BASH_REMATCH[2]}"
          echo "UPSTREAM_TAG=$TAG" >> "$GITHUB_ENV"
          echo "UPSTREAM_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BRANCH=automation/upstream-v$VERSION" >> "$GITHUB_ENV"

      - name: Merge exact official release into a new proposal branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/block/buzz.git
          git fetch --no-tags upstream "refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG"
          UPSTREAM_SHA=$(git rev-parse "$UPSTREAM_TAG^{commit}")
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> "$GITHUB_ENV"
          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            echo "already_current=true" >> "$GITHUB_ENV"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "proposal_exists=true" >> "$GITHUB_ENV"
            exit 0
          fi
          git switch -c "$BRANCH"
          if ! git merge --no-edit "$UPSTREAM_SHA"; then
            echo "::error::Exact release $UPSTREAM_TAG ($UPSTREAM_SHA) conflicts with fork/main"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          node desktop/scripts/verify-release-version.mjs "$UPSTREAM_VERSION"
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Open review pull request when missing
        if: env.already_current != 'true'
        env:
          GH_TOKEN: ${{ secrets.NYTEMODE_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$(gh pr list --base main --head "$BRANCH" --state open --json number --jq length)" == "0" ]]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: integrate block/buzz $UPSTREAM_TAG" \
              --body-file docs/UPSTREAM_SYNC.md
          fi
