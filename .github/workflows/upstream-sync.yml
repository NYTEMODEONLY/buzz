name: Propose upstream sync

on:
  workflow_dispatch:
  schedule:
    - cron: "23 13 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nytemode-upstream-sync
  cancel-in-progress: true

jobs:
  propose:
    if: github.repository == 'NYTEMODEONLY/buzz'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Merge current upstream into proposal branch
        env:
          BRANCH: automation/upstream-sync
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/block/buzz.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "already_current=true" >> "$GITHUB_ENV"
            exit 0
          fi
          git switch -C "$BRANCH"
          git merge --no-edit upstream/main
          git push --force-with-lease origin "$BRANCH"

      - name: Open or refresh review pull request
        if: env.already_current != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head automation/upstream-sync \
            --title "chore: sync current block/buzz main" \
            --body-file docs/UPSTREAM_SYNC.md \
            2>/dev/null || \
          gh pr edit automation/upstream-sync \
            --title "chore: sync current block/buzz main" \
            --body-file docs/UPSTREAM_SYNC.md
