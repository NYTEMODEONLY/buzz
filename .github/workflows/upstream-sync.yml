name: Propose upstream sync

on:
  workflow_dispatch:
  schedule:
    - cron: "23 13 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nytemode-upstream-sync
  cancel-in-progress: true

jobs:
  propose:
    if: github.repository == 'NYTEMODEONLY/buzz'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Resolve latest official desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(gh api repos/block/buzz/releases/latest --jq .tag_name)
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Latest Block release tag '$TAG' is not stable desktop SemVer"
            exit 1
          }
          echo "UPSTREAM_TAG=$TAG" >> "$GITHUB_ENV"
          echo "BRANCH=automation/upstream-$TAG" >> "$GITHUB_ENV"

      - name: Merge exact official release into a new proposal branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/block/buzz.git
          git fetch --no-tags upstream "refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG"
          UPSTREAM_SHA=$(git rev-parse "$UPSTREAM_TAG^{commit}")
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> "$GITHUB_ENV"
          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            echo "already_current=true" >> "$GITHUB_ENV"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "proposal_exists=true" >> "$GITHUB_ENV"
            exit 0
          fi
          git switch -c "$BRANCH"
          if ! git merge --no-edit "$UPSTREAM_SHA"; then
            echo "::error::Exact release $UPSTREAM_TAG ($UPSTREAM_SHA) conflicts with fork/main"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Open or refresh review pull request
        if: env.already_current != 'true' && env.proposal_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: integrate block/buzz $UPSTREAM_TAG" \
            --body-file docs/UPSTREAM_SYNC.md
